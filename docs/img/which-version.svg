<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Use the main model by default; use the timestamps revision for sentence times or long audio">
<rect width="1000" height="330" rx="12" fill="#ffffff"/>
<text x="24.0" y="38.0" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">Which version of the model?</text>
<text x="24.0" y="62.0" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">Do you need sentence timestamps, or long audio transcribed without cutting it yourself?</text>
<rect x="24" y="84" width="466" height="226" rx="10" fill="#e8f0fa" stroke="#2f6fb3" stroke-width="1.5"/>
<g transform="translate(42.0 102.0) scale(1.000)" fill="none" stroke="#2f6fb3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" /> <path d="M12 22V12" /> <path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7" /> <path d="m7.5 4.27 9 5.15" /> </g>
<text x="76.0" y="121.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">No: main (tag v1.0), the default</text>
<text x="42" y="154" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#2f6fb3">revision=&quot;main&quot;</text>
<text x="42.0" y="186.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">• Cut the audio into 15–25 s pieces (code in the model card).</text>
<text x="42.0" y="210.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">• The better one on the webinar and on VoxPopuli.</text>
<text x="42.0" y="234.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">• Its own timestamps are not usable.</text>
<line x1="42" y1="264" x2="472" y2="264" stroke="#d8dee4"/>
<text x="42.0" y="290.0" font-size="14" font-weight="700" fill="#2f6fb3" text-anchor="start">SKN dialects 21.1 % · FLEURS 7.6 % · VoxPopuli 10.8 %</text>
<rect x="510" y="84" width="466" height="226" rx="10" fill="#f6eee4" stroke="#8a5a2b" stroke-width="1.5"/>
<g transform="translate(528.0 102.0) scale(1.000)" fill="none" stroke="#8a5a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 10v3m4-7v11m4-14v18m4-13v7m4-10v13m4-8v3"/></g>
<text x="562.0" y="121.0" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">Yes: the timestamps revision</text>
<text x="528" y="154" font-size="14" font-family="ui-monospace, Consolas, monospace" fill="#8a5a2b">revision=&quot;timestamps&quot;</text>
<text x="528.0" y="186.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">• Sentence start times: 58 % within 1 s of SKN&#x27;s.</text>
<text x="528.0" y="210.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">• Long audio in one go, always with temperature fallback.</text>
<text x="528.0" y="234.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">• Same dialect accuracy, slightly worse on VoxPopuli.</text>
<line x1="528" y1="264" x2="958" y2="264" stroke="#d8dee4"/>
<text x="528.0" y="290.0" font-size="14" font-weight="700" fill="#8a5a2b" text-anchor="start">SKN dialects 21.4 % · FLEURS 7.4 % · VoxPopuli 11.2 %</text>
</svg>
