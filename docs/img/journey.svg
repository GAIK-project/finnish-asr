<path d="M148.0 434 V410 a10 10 0 0 1 10 -10 H478.0 a10 10 0 0 1 10 10 V434 Z" fill="#1d3f6e"/>
<text x="162.0" y="423.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Internal version</text>
<text x="162.0" y="460.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">+ 56 h more dialect interviews (LA-murre);</text>
<text x="162.0" y="480.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">Opus rewrote their dialect spelling</text>
<text x="162.0" y="500.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">into standard Finnish</text>
<g transform="translate(162.0 512.0) scale(0.667)" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2m0-20v2m5 16v2m0-20v2M2 12h2m-2 5h2M2 7h2m16 5h2m-2 5h2M20 7h2M7 20v2M7 2v2"/><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="8" height="8" x="8" y="8" rx="1"/></g>
<text x="184.0" y="525.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">LUMI, 4 h 57 min</text>
<text x="162.0" y="570.0" font-size="30" font-weight="700" fill="#1d3f6e" text-anchor="start">19.7 %</text>
<text x="276.0" y="554.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start">the best, but kept internal:</text>
<text x="276.0" y="572.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">LA-murre&#x27;s licence (CC BY-ND)</text>
<text x="276.0" y="590.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">forbids sharing changed texts</text>
<path d="M884.0 327 V362.0 H318.0 V395" fill="none" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
