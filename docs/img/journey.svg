<path d="M274 96 V72 a10 10 0 0 1 10 -10 H484 a10 10 0 0 1 10 10 V96 Z" fill="#9aa4ae"/>
<text x="288.0" y="85.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Pilot</text>
<text x="288.0" y="122.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">+ read sentences (FLEURS)</text>
<text x="288.0" y="142.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">+ parliament speech</text>
<text x="288.0" y="162.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">   (VoxPopuli)</text>
