<text x="526.0" y="460.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">+ Whisper&#x27;s timestamp tokens on half</text>
<text x="526.0" y="480.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">of the SKN training segments</text>
