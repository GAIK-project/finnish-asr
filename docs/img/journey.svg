<text x="788.0" y="122.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">+ Opus adds punctuation</text>
<text x="788.0" y="142.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">+ bigger LoRA, best of</text>
<text x="788.0" y="162.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">   3 epochs</text>
<g transform="translate(788.0 188.0) scale(0.667)" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2m0-20v2m5 16v2m0-20v2M2 12h2m-2 5h2M2 7h2m16 5h2m-2 5h2M20 7h2M7 20v2M7 2v2"/><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="8" height="8" x="8" y="8" rx="1"/></g>
<text x="810.0" y="201.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">LUMI, 3 h 8 min</text>
<text x="788.0" y="250.0" font-size="30" font-weight="700" fill="#2f6fb3" text-anchor="start">21.1 %</text>
<text x="788.0" y="270.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">dialect test</text>
<line x1="788" y1="284" x2="980" y2="284" stroke="#d8dee4"/>
<text x="788.0" y="307.0" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="start">Published as v1.0</text>
