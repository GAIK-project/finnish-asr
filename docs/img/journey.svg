<text x="310.0" y="201.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">LUMI, 51 min</text>
<text x="288.0" y="250.0" font-size="30" font-weight="700" fill="#1f2328" text-anchor="start">–</text>
<text x="288.0" y="270.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">not run on the dialect test</text>
<line x1="288" y1="284" x2="480" y2="284" stroke="#d8dee4"/>
<text x="288.0" y="307.0" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="start">Read speech is not enough</text>
<line x1="497.0" y1="193.0" x2="521.0" y2="193.0" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
