<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Training rounds: pilot, round 1 with dialect interviews, round 2 published, an internal version and a timestamps version">
<rect width="1000" height="640" rx="12" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
<text x="24.0" y="38.0" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">How the model got better, round by round</text>
<text x="976.0" y="38.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="end">dialect test = words wrong on 600 segments from 10 unheard municipalities</text>
<rect x="24" y="62" width="220" height="262" rx="10" fill="#f3f4f6" stroke="#9aa4ae" stroke-width="1.5"/>
<path d="M24 96 V72 a10 10 0 0 1 10 -10 H234 a10 10 0 0 1 10 10 V96 Z" fill="#9aa4ae"/>
<text x="38.0" y="85.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Start</text>
<text x="38.0" y="122.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">Whisper large-v3 by OpenAI,</text>
<text x="38.0" y="142.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">as it is</text>
<text x="38.0" y="250.0" font-size="30" font-weight="700" fill="#1f2328" text-anchor="start">40.4 %</text>
<text x="38.0" y="270.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">dialect test</text>
<line x1="247.0" y1="193.0" x2="271.0" y2="193.0" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
