<text x="548.0" y="505.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">LUMI, 3 h 6 min</text>
<text x="526.0" y="570.0" font-size="30" font-weight="700" fill="#8a5a2b" text-anchor="start">21.4 %</text>
<text x="640.0" y="554.0" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start">and sentence times that work:</text>
<text x="640.0" y="572.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">published as the timestamps</text>
<text x="640.0" y="590.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">branch</text>
