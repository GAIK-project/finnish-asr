<path d="M524 96 V72 a10 10 0 0 1 10 -10 H734 a10 10 0 0 1 10 10 V96 Z" fill="#2f6fb3"/>
<text x="538.0" y="85.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Round 1</text>
<text x="538.0" y="122.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">+ 62 h of dialect</text>
<text x="538.0" y="142.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">   interviews (SKN)</text>
<g transform="translate(538.0 188.0) scale(0.667)" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2m0-20v2m5 16v2m0-20v2M2 12h2m-2 5h2M2 7h2m16 5h2m-2 5h2M20 7h2M7 20v2M7 2v2"/><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="8" height="8" x="8" y="8" rx="1"/></g>
<text x="560.0" y="201.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">LUMI, 2 h 2 min</text>
<text x="538.0" y="250.0" font-size="30" font-weight="700" fill="#2f6fb3" text-anchor="start">22.2 %</text>
<text x="538.0" y="270.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">dialect test</text>
