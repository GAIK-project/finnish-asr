<text x="58.0" y="302.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">The check: the words must be exactly the person&#x27;s. 15 024 of 15 042 passed; the other 18</text>
<text x="58.0" y="322.0" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start">stayed as they were. Opus never heard audio and never wrote a test reference.</text>
<text x="24.0" y="356.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Why: SKN&#x27;s text has no punctuation, so without this the model learned to write without full stops.</text>
